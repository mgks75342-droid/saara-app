name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        run: |
          set -e
          SDK=/usr/local/lib/android/sdk
          JAR=$SDK/platforms/android-34/android.jar
          BT=$SDK/build-tools/34.0.0
          OUT=$GITHUB_WORKSPACE/out
          rm -rf $OUT && mkdir -p $OUT/classes

          cd $GITHUB_WORKSPACE/app
          $BT/aapt package -f -M AndroidManifest.xml -S res -A assets -I $JAR -F $OUT/base.apk
          javac --release 8 -cp $JAR -d $OUT/classes $(find src -name '*.java')
          $BT/d8 --lib $JAR --output $OUT $(find $OUT/classes -name '*.class')

          cd $OUT
          cp base.apk unsigned.apk
          zip -j unsigned.apk classes.dex
          keytool -genkeypair -v -keystore debug.jks -storepass android -keypass android \
            -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sara"
          $BT/zipalign -f 4 unsigned.apk aligned.apk
          $BT/apksigner sign --ks debug.jks --ks-pass pass:android --key-pass pass:android \
            --out Sara.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sara-APK
          path: out/Sara.apk
