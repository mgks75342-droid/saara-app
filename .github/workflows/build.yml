name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Build
        run: |
          cd app
          ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar
          if [ ! -f "$ANDROID_JAR" ]; then sdkmanager "platforms;android-34" "build-tools;34.0.0"; fi
          BT=$ANDROID_HOME/build-tools/34.0.0
          $BT/aapt package -f -M AndroidManifest.xml -A assets -I $ANDROID_JAR -F ../build.apk
          mkdir -p ../classes
          javac -source 8 -target 8 -cp $ANDROID_JAR -d ../classes src/com/sara/app/MainActivity.java
          cd ../classes && $BT/d8 --lib $ANDROID_JAR --output ../ $(find . -name '*.class') && cd ..
          zip -j build.apk classes.dex
          keytool -genkey -v -keystore debug.jks -storepass android -keypass android -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Sara"
          $BT/apksigner sign --ks debug.jks --ks-pass pass:android --out Sara.apk build.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sara-APK
          path: Sara.apk
