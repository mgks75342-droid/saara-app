<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sara</title>
<style>
  :root {
    --pink: #ff2fa6;
    --pink-soft: #ff7fd0;
    --glow: rgba(255, 47, 166, 0.55);
    --bg: #05000a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: var(--bg); color: #fff; overflow: hidden;
    font-family: "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
  }

  .screen {
    position: relative; width: 100%; max-width: 430px; height: 100%;
    margin: 0 auto; overflow: hidden;
    background:
      radial-gradient(circle at 50% 22%, rgba(255,47,166,.20), transparent 40%),
      radial-gradient(circle at 50% 70%, rgba(255,47,166,.10), transparent 45%),
      var(--bg);
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 12px);
  }

  /* decoration */
  .deco { position: absolute; pointer-events: none; }
  .star { width: 22px; height: 22px; color: var(--pink-soft); filter: drop-shadow(0 0 6px var(--pink)); }
  .bokeh {
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,47,166,.6), rgba(255,47,166,0) 70%);
  }

  /* header */
  .header { position: relative; height: 150px; flex-shrink: 0; }
  .btn-menu {
    position: absolute; left: 18px; top: 18px;
    width: 58px; height: 58px; border-radius: 50%;
    background: transparent; border: 2px solid var(--pink); color: #fff;
    box-shadow: 0 0 14px var(--glow), inset 0 0 10px rgba(255,47,166,.25);
    display: grid; place-items: center; cursor: pointer;
  }
  .logo {
    position: absolute; left: 0; right: 0; top: 26px; text-align: center;
    font-size: 40px; font-weight: 800; letter-spacing: 8px; color: #ffd9f0;
    text-shadow: 0 0 6px #ff4fb8, 0 0 18px var(--pink), 0 0 36px var(--pink);
  }
  .logo-line {
    position: absolute; left: 14%; right: 14%; top: 100px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--pink), transparent);
    box-shadow: 0 0 10px var(--pink);
  }

  /* orb area */
  .orb-area { position: relative; flex: 1; min-height: 0; }
  .mic-wrap {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    width: 300px; height: 300px; display: grid; place-items: center;
  }
  .ring { position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,47,166,.3); }
  .r1 { width: 250px; height: 250px; }
  .r2 { width: 300px; height: 300px; border-color: rgba(255,47,166,.2); }
  .r3 { width: 360px; height: 360px; border-color: rgba(255,47,166,.1); }

  .orb {
    border-radius: 50%; border: none; cursor: pointer; color: #fff;
    background: radial-gradient(circle at 35% 30%, #ffd1ec 0%, #ff4fb8 28%, #e0108a 70%, #9a0660 100%);
    box-shadow: 0 0 30px var(--pink), 0 0 70px var(--glow), inset -10px -14px 24px rgba(90,0,50,.45);
    display: grid; place-items: center;
    transition: transform .2s ease;
  }
  .orb:active { transform: scale(.97); }
  .orb.big { width: 210px; height: 210px; }
  .orb svg { width: 74px; height: 74px; filter: drop-shadow(0 0 6px rgba(255,255,255,.6)); }
  .orb.on { box-shadow: 0 0 40px var(--pink), 0 0 90px var(--glow), inset -10px -14px 24px rgba(90,0,50,.45); }

  .planet-wrap {
    position: absolute; left: 50%; top: 80%; transform: translate(-50%, -50%);
    width: 200px; height: 200px; display: grid; place-items: center; pointer-events: none;
  }
  .planet-ring {
    position: absolute; width: 230px; height: 90px; border-radius: 50%;
    border: 2px solid rgba(255,47,166,.5); transform: rotate(-18deg);
    box-shadow: 0 0 12px rgba(255,47,166,.4);
  }
  .planet {
    width: 128px; height: 128px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd1ec 0%, #ff4fb8 30%, #d0107f 80%);
    box-shadow: 0 0 26px var(--pink), inset -8px -10px 18px rgba(90,0,50,.45);
    display: grid; place-items: center;
    font-size: 40px; font-weight: 700; color: #1a0010;
  }

  /* info cards */
  .cards {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    padding: 0 18px; margin-bottom: 22px; flex-shrink: 0;
  }
  .card {
    background: rgba(20,0,12,.55); border: 2px solid var(--pink-soft); border-radius: 22px;
    box-shadow: 0 0 14px var(--glow), inset 0 0 12px rgba(255,47,166,.15);
    padding: 16px 8px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    color: #fff;
  }
  .card svg { width: 40px; height: 40px; }
  .card .label { font-size: 15px; }
  .card .value { font-size: 22px; font-weight: 700; }

  /* bottom controls */
  .controls {
    display: grid; grid-template-columns: 1fr 1.25fr 1fr; align-items: center; justify-items: center;
    padding: 0 26px 26px; flex-shrink: 0;
  }
  .ctrl {
    width: 86px; height: 86px; border-radius: 50%; cursor: pointer; color: #fff;
    background: rgba(10,0,6,.8); border: 2.5px solid var(--pink-soft); box-shadow: 0 0 14px var(--glow);
    display: grid; place-items: center;
  }
  .ctrl svg { width: 34px; height: 34px; }
  .ctrl.main {
    width: 124px; height: 124px; border: 3px solid var(--pink);
    box-shadow: 0 0 22px var(--pink), 0 0 50px var(--glow), inset 0 0 20px rgba(255,47,166,.3);
  }
  .ctrl.main svg { width: 46px; height: 46px; }
  .ctrl.main.on { box-shadow: 0 0 40px var(--pink), 0 0 90px var(--glow), inset 0 0 26px rgba(255,47,166,.5); }

  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 150px; height: 5px; border-radius: 3px; background: #fff;
  }


  /* settings panel */
  .panel {
    position: absolute; inset: 0; z-index: 20; display: none;
    background: rgba(5,0,10,.94); padding: 80px 24px 24px; overflow-y: auto;
  }
  .panel.open { display: block; }
  .panel h2 { color: #ffd9f0; text-shadow: 0 0 10px var(--pink); margin-bottom: 22px; font-size: 26px; }
  .row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: rgba(20,0,12,.7); border: 2px solid var(--pink-soft); border-radius: 18px;
    padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 0 12px var(--glow);
  }
  .row small { display: block; color: #d9b8cc; font-size: 13px; margin-top: 4px; }
  .switch { width: 52px; height: 30px; border-radius: 16px; border: 2px solid var(--pink); background: #120010; position: relative; cursor: pointer; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #ffd9f0; transition: left .2s; }
  .switch.on { background: var(--pink); }
  .switch.on::after { left: 25px; }
  .pill { background: transparent; color: #fff; border: 2px solid var(--pink); border-radius: 14px; padding: 10px 14px; cursor: pointer; font-size: 14px; }
  .close { margin-top: 10px; }

  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="screen">

  <!-- decoration -->
  <svg class="deco star" style="left:7%; top:19%" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
  <svg class="deco star" style="left:50%; top:33%; width:16px; height:16px" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
  <svg class="deco star" style="left:60%; top:60%; width:18px; height:18px" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
  <div class="deco bokeh" style="left:-4%; top:4%; width:120px; height:120px; opacity:.4"></div>
  <div class="deco bokeh" style="right:-6%; top:12%; width:150px; height:150px; opacity:.35"></div>
  <div class="deco bokeh" style="left:-6%; top:42%; width:110px; height:110px; opacity:.35"></div>
  <div class="deco bokeh" style="right:4%; top:52%; width:130px; height:130px; opacity:.35"></div>
  <div class="deco bokeh" style="left:-2%; bottom:14%; width:140px; height:140px; opacity:.3"></div>
  <div class="deco bokeh" style="right:-2%; bottom:18%; width:110px; height:110px; opacity:.3"></div>

  <!-- header -->
  <header class="header">
    <button class="btn-menu" id="btnMenu" aria-label="Menu">
      <svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <line x1="2" y1="3" x2="24" y2="3"/><line x1="2" y1="10" x2="24" y2="10"/><line x1="2" y1="17" x2="24" y2="17"/>
      </svg>
    </button>
    <div class="logo">SARA</div>
    <div class="logo-line"></div>
  </header>

  <!-- orb + planet -->
  <section class="orb-area">
    <div class="mic-wrap">
      <div class="ring r3"></div>
      <div class="ring r2"></div>
      <div class="ring r1"></div>
      <button class="orb big mic-live" id="orbMic" aria-label="Sara voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
      </button>
    </div>

    <div class="planet-wrap">
      <div class="planet-ring"></div>
      <div class="planet">S</div>
    </div>
  </section>

  <!-- info cards -->
  <section class="cards">
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <path d="M7 18h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6-1.5A4.5 4.5 0 0 0 7 18z"/>
      </svg>
      <span class="label">Temperature</span>
      <span class="value">22°C</span>
    </div>
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M3 8h12a3 3 0 1 0-3-3"/><path d="M3 12h16a3 3 0 1 1-3 3"/><path d="M3 16h8"/>
      </svg>
      <span class="label">Haze</span>
      <span class="value">High</span>
    </div>
    <div class="card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>
      </svg>
      <span class="label">Humidity</span>
      <span class="value">18:25</span>
    </div>
  </section>

  <!-- bottom controls -->
  <nav class="controls">
    <button class="ctrl" aria-label="Apps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
    </button>
    <button class="ctrl main mic-live" id="btnMic" aria-label="Microphone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/>
      </svg>
    </button>
    <button class="ctrl" aria-label="Chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <path d="M4 5h16v11H9l-5 4z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="12" x2="13" y2="12"/>
      </svg>
    </button>
  </nav>


  <!-- settings panel -->
  <section class="panel" id="panel">
    <h2>Settings</h2>
    <div class="row">
      <div><b>G App mode</b><small>জান বাবু / সোনা বলে ডাকবে, আর মাঝে মাঝে মিষ্টি কথা বলবে</small></div>
      <div class="switch" id="gappSwitch" role="switch" aria-label="G App mode"></div>
    </div>
    <div class="row">
      <div><b>Accessibility</b><small id="axStatus">অবস্থা দেখা হচ্ছে...</small></div>
      <button class="pill" id="axBtn">খুলুন</button>
    </div>
    <button class="pill close" id="panelClose">বন্ধ করুন</button>
  </section>

  <div class="home-indicator"></div>
</div>

<script src="mic.js"></script>
<script>
  var KEY_NAME = "saara_gemini_key";
  var GAPP_NAME = "saara_gapp_mode";
  var micOn = false;

  function getKey() {
    var k = localStorage.getItem(KEY_NAME);
    if (!k) {
      k = (window.prompt("Gemini API key daao (AIza...)") || "").trim();
      if (k) localStorage.setItem(KEY_NAME, k);
    }
    return k;
  }

  function gappOn() { return localStorage.getItem(GAPP_NAME) === "1"; }
  function native() { return (typeof window.SaraNative !== "undefined") ? window.SaraNative : null; }

  function buildPrompt() {
    var base = "Tum Saara ho, ek pyaari female voice assistant. Jawab chhote aur friendly rakho. " +
      "User jab koi app khulne ya phone control karne ko bole, to open_app ya phone_action tool use karo. " +
      "Tool ka result sun kar user ko short mein batao kya hua.";
    if (!gappOn()) return base;
    return base + " G APP MODE CHALU HAI: user ko 'জান বাবু' ya 'সোনা' bolkar daako, kabhi kabhi ek ko, kabhi doosre ko. " +
      "Har 2-3 vakya bolne ke baad ek chhoti, mithi, sundar si line jodo, rachona halka, pyaara aur hasi bhara rakho, " +
      "kabhi asabhya ya jabardasti nahi. Bangla mein bolo.";
  }

  var tools = [{
    functionDeclarations: [
      {
        name: "open_app",
        description: "Phone mein kisi app ko naam se khulo. User ke bolne wala naam (Bangla ya English) pass karo.",
        parameters: { type: "OBJECT", properties: { app_name: { type: "STRING", description: "App ka naam" } }, required: ["app_name"] }
      },
      {
        name: "phone_action",
        description: "Phone control. action: back, home, recents, notifications, scroll_down, scroll_up, click_text (target = jo text par click karna hai).",
        parameters: { type: "OBJECT", properties: {
          action: { type: "STRING", description: "back | home | recents | notifications | scroll_down | scroll_up | click_text" },
          target: { type: "STRING", description: "click_text ke liye text" }
        }, required: ["action"] }
      }
    ]
  }];

  function handleTool(name, args) {
    var n = native();
    if (!n) return "Android bridge available nahi hai; ye feature sirf app ke andar chalega.";
    args = args || {};
    if (name === "open_app") return n.openApp(String(args.app_name || ""));
    if (name === "phone_action") return n.phoneAction(String(args.action || ""), String(args.target || ""));
    return "Ajaana tool: " + name;
  }

  function refreshPanel() {
    document.getElementById("gappSwitch").classList.toggle("on", gappOn());
    var n = native();
    document.getElementById("axStatus").textContent =
      n ? (n.isAccessibilityOn() ? "চালু আছে" : "বন্ধ - চালু করতে 'খুলুন' চাপুন") : "শুধু অ্যাপের ভেতরে কাজ করে";
  }

  function setMicUi(on) {
    micOn = on;
    document.querySelectorAll(".mic-live").forEach(function (el) { el.classList.toggle("on", on); });
  }

  function toggleMic() {
    if (micOn) { SaaraMic.stop(); setMicUi(false); return; }
    var key = getKey();
    if (!key) return;
    SaaraMic.start({
      apiKey: key,
      voice: "Kore",
      systemPrompt: buildPrompt(),
      tools: tools,
      onToolCall: function (name, args) { return handleTool(name, args); },
      onConnected: function () { setMicUi(true); },
      onClosed: function () { setMicUi(false); },
      onError: function (e) { setMicUi(false); console.warn("[Sara]", e); }
    });
  }

  document.getElementById("btnMic").addEventListener("click", toggleMic);
  document.getElementById("orbMic").addEventListener("click", toggleMic);
  document.getElementById("btnMenu").addEventListener("click", function () {
    refreshPanel(); document.getElementById("panel").classList.add("open");
  });
  document.getElementById("panelClose").addEventListener("click", function () {
    document.getElementById("panel").classList.remove("open");
  });
  document.getElementById("gappSwitch").addEventListener("click", function () {
    localStorage.setItem(GAPP_NAME, gappOn() ? "0" : "1");
    refreshPanel();
    if (micOn) { SaaraMic.stop(); setMicUi(false); }  // notun prompt apply hote notun session lage
  });
  document.getElementById("axBtn").addEventListener("click", function () {
    var n = native(); if (n) n.openAccessibilitySettings();
  });

</script>
</body>
</html>
