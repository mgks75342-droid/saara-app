<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sara</title>
<style>
  :root { --pink:#ff2fa6; --pink-soft:#ff8ad6; --glow:rgba(255,47,166,.6); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#000; overflow:hidden;
    font-family:"Segoe UI", Roboto, "Noto Sans Bengali", sans-serif; color:#fff; }

  .wrap {
    position:relative; height:100vh; height:100dvh; aspect-ratio:941 / 1672;
    max-width:100vw; margin:0 auto; overflow:hidden; background:#050008;
  }
  .wrap > img {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    display:block; pointer-events:none; user-select:none;
  }
  /* phone status bar and home bar from the reference image are covered */
  .cover { position:absolute; left:0; right:0; background:#050008; z-index:2; pointer-events:none; }
  .cover.top { top:0; height:5.2%; }
  .cover.bottom { bottom:0; height:2.4%; }

  .hit {
    position:absolute; z-index:3; background:transparent; border:0; padding:0; cursor:pointer;
  }
  .hit.round { border-radius:50%; }
  .hit.rect { border-radius:6%; }
  .hit:active { background:rgba(255,47,166,.14); }
  .hit:focus-visible { outline:2px solid #fff; outline-offset:2px; }

  /* feature panel (opens from menu button) */
  .panel {
    position:fixed; top:0; left:0; bottom:0; width:min(88vw, 380px);
    background:rgba(8,0,10,.97); border-right:2px solid var(--pink);
    box-shadow:0 0 30px var(--glow); z-index:20; overflow-y:auto; padding:18px 16px 40px;
    transform:translateX(-102%); transition:transform .25s ease;
  }
  .panel.open { transform:translateX(0); }
  .panel-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .panel-head h2 { font-size:20px; color:var(--pink-soft); letter-spacing:2px; }
  .x { width:40px; height:40px; border-radius:50%; background:transparent; color:#fff;
    border:2px solid var(--pink); font-size:18px; cursor:pointer; }
  .status { font-size:13px; line-height:1.6; color:#ffd6f0; background:rgba(255,47,166,.08);
    border:1px solid rgba(255,47,166,.4); border-radius:12px; padding:10px; margin-bottom:12px; }
  .pbtn { display:block; width:100%; margin:8px 0; padding:12px; border-radius:14px; cursor:pointer;
    background:rgba(20,0,14,.8); color:#fff; border:2px solid var(--pink-soft);
    box-shadow:0 0 12px var(--glow); font-size:15px; }
  .pbtn:active { background:rgba(255,47,166,.2); }
  h4 { margin:18px 0 8px; font-size:15px; color:var(--pink-soft); }
  input, textarea {
    width:100%; padding:10px; margin:6px 0; border-radius:10px; background:#12000c; color:#fff;
    border:1px solid rgba(255,47,166,.6); font-size:14px; font-family:inherit;
  }
  textarea { min-height:60px; resize:vertical; }
  .out { white-space:pre-wrap; word-break:break-word; font-size:13px; line-height:1.5;
    background:#0c0008; border:1px solid rgba(255,47,166,.3); border-radius:10px;
    padding:10px; margin:8px 0; max-height:260px; overflow-y:auto; font-family:inherit; }
  .file { display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 10px; margin:6px 0; border-radius:10px; background:rgba(255,47,166,.07);
    border:1px solid rgba(255,47,166,.3); font-size:14px; }
  .file small { color:#ffb3e3; }
  .file .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .del { padding:6px 10px; border-radius:10px; background:transparent; color:#ff8ab0;
    border:1px solid #ff4fb8; cursor:pointer; }
  .msg { font-size:13px; color:#ffd6f0; min-height:18px; margin-top:8px; }
</style>
</head>
<body>

<div class="wrap">
  <img src="bg.jpg" alt="Sara">
  <div class="cover top"></div>
  <div class="cover bottom"></div>

  <button class="hit round" id="menuBtn" aria-label="Menu" style="left:3.61%;top:5.38%;width:12.75%;height:7.18%"></button>
  <button class="hit round mic-live" id="orbMic" aria-label="Voice orb" style="left:38.58%;top:17.94%;width:22.95%;height:12.92%"></button>
  <button class="hit round" id="planetBtn" aria-label="Sara" style="left:40.60%;top:40.79%;width:18.70%;height:10.53%"></button>
  <button class="hit rect" id="cardTemp" aria-label="Temperature" style="left:4.78%;top:68.36%;width:28.91%;height:12.68%"></button>
  <button class="hit rect" id="cardHaze" aria-label="Haze" style="left:36.45%;top:68.36%;width:27.10%;height:12.68%"></button>
  <button class="hit rect" id="cardHum" aria-label="Humidity" style="left:66.42%;top:68.36%;width:28.91%;height:12.68%"></button>
  <button class="hit round" id="btnApps" aria-label="Apps" style="left:14.03%;top:84.27%;width:17.85%;height:10.05%"></button>
  <button class="hit round mic-live" id="btnMic" aria-label="Microphone" style="left:37.51%;top:82.24%;width:25.08%;height:14.11%"></button>
  <button class="hit round" id="btnChat" aria-label="Chat" style="left:68.12%;top:84.27%;width:17.85%;height:10.05%"></button>
</div>

<!-- feature panel -->
<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-head">
    <h2>SARA মেনু</h2>
    <button class="x" id="closePanel" aria-label="Close">✕</button>
  </div>

  <div class="status" id="status">অবস্থা লোড হচ্ছে...</div>

  <button class="pbtn" id="btnA11y">অ্যাক্সেসিবিলিটি সেটিং খুলুন</button>
  <button class="pbtn" id="btnNotifAccess">নোটিফিকেশন অ্যাক্সেস খুলুন</button>
  <button class="pbtn" id="btnAllFiles">ফাইল অ্যাক্সেস খুলুন (All files)</button>

  <h4>স্ক্রিন পড়া</h4>
  <button class="pbtn" id="btnReadScreen">এখন স্ক্রিনে যা আছে পড়ো</button>
  <div class="out" id="screenOut"></div>

  <h4>নোটিফিকেশন</h4>
  <button class="pbtn" id="btnNotif">শেষ নোটিফিকেশনগুলো দেখো</button>
  <div class="out" id="notifOut"></div>

  <h4>অ্যাপ খোলো</h4>
  <input id="appSearch" placeholder="অ্যাপের নাম লিখুন (খালি রাখলে সব)">
  <button class="pbtn" id="btnLoadApps">অ্যাপের তালিকা দেখো</button>
  <div id="appList"></div>

  <h4>ফাইল ম্যানেজার</h4>
  <input id="fpath" placeholder="ফোল্ডার পথ (খালি রাখলে মূল স্টোরেজ)">
  <button class="pbtn" id="btnList">ফোল্ডার দেখো</button>
  <div id="flist"></div>

  <h4>নতুন ফাইল</h4>
  <input id="fname" placeholder="ফাইলের নাম, যেমন note.txt">
  <textarea id="fcontent" placeholder="ফাইলের লেখা (ঐচ্ছিক)"></textarea>
  <button class="pbtn" id="btnNew">ফাইল বানাও (ফোল্ডার: উপরের পথ)</button>

  <div class="msg" id="msg"></div>
</aside>

<script src="mic.js"></script>
<script>
(function () {
  var panel = document.getElementById("panel");
  var msg = document.getElementById("msg");
  var rootPath = "";

  function say(t) { msg.textContent = t; }
  function hasBridge() { return typeof window.Android !== "undefined"; }
  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!hasBridge()) { say("এই কাজ APK-তে চালালে হবে।"); return ""; }
    return Android[name].apply(Android, args);
  }

  // ---- panel open/close ----
  function openPanel() { panel.classList.add("open"); panel.setAttribute("aria-hidden", "false"); refreshStatus(); }
  function closePanel() { panel.classList.remove("open"); panel.setAttribute("aria-hidden", "true"); }
  document.getElementById("menuBtn").addEventListener("click", openPanel);
  document.getElementById("closePanel").addEventListener("click", closePanel);

  // ---- status ----
  function refreshStatus() {
    var s = {};
    try { s = JSON.parse(call("status") || "{}"); } catch (e) {}
    rootPath = s.root || "";
    var on = function (b) { return b ? "চালু ✔" : "বন্ধ ✖"; };
    document.getElementById("status").textContent =
      "স্ক্রিন পড়া (অ্যাক্সেসিবিলিটি): " + on(s.accessibility) + "\n" +
      "নোটিফিকেশন: " + on(s.notifications) + "\n" +
      "সব ফাইল অ্যাক্সেস: " + on(s.allFiles);
  }

  document.getElementById("btnA11y").addEventListener("click", function () { call("openAccessibility"); });
  document.getElementById("btnNotifAccess").addEventListener("click", function () { call("openNotificationAccess"); });
  document.getElementById("btnAllFiles").addEventListener("click", function () { call("openAllFilesAccess"); });

  // ---- screen reading ----
  document.getElementById("btnReadScreen").addEventListener("click", function () {
    document.getElementById("screenOut").textContent = call("getScreenText") || "";
  });

  // ---- notifications ----
  function renderNotifs() {
    var box = document.getElementById("notifOut");
    var arr = [];
    try { arr = JSON.parse(call("getNotifications") || "[]"); } catch (e) {}
    box.innerHTML = "";
    if (!arr.length) { box.textContent = "কোনো নোটিফিকেশন নেই।"; return; }
    arr.forEach(function (n) {
      var row = document.createElement("div");
      row.className = "file";
      var txt = document.createElement("div");
      txt.className = "name";
      txt.style.whiteSpace = "pre-wrap";
      txt.textContent = n.text;
      var b = document.createElement("button");
      b.className = "del";
      b.textContent = "মোছো";
      b.addEventListener("click", function () {
        var r = call("dismissNotification", n.key);
        if (r === "OK") renderNotifs(); else say(String(r).replace("ERR:", ""));
      });
      row.appendChild(txt); row.appendChild(b);
      box.appendChild(row);
    });
  }
  document.getElementById("btnNotif").addEventListener("click", renderNotifs);

  // ---- apps ----
  var appsCache = null;
  function getApps() {
    if (!appsCache) {
      try { appsCache = JSON.parse(call("listApps") || "[]"); } catch (e) { appsCache = []; }
    }
    return appsCache;
  }
  function renderApps() {
    var q = document.getElementById("appSearch").value.trim().toLowerCase();
    var box = document.getElementById("appList");
    box.innerHTML = "";
    getApps().filter(function (a) {
      return !q || a.name.toLowerCase().indexOf(q) > -1 || a.pkg.toLowerCase().indexOf(q) > -1;
    }).forEach(function (a) {
      var row = document.createElement("div");
      row.className = "file";
      var nm = document.createElement("div");
      nm.className = "name";
      nm.textContent = a.name;
      var b = document.createElement("button");
      b.className = "del";
      b.textContent = "খোলো";
      b.addEventListener("click", function () {
        var r = call("openApp", a.pkg);
        if (r !== "OK") say(String(r).replace("ERR:", ""));
      });
      row.appendChild(nm); row.appendChild(b);
      box.appendChild(row);
    });
  }
  document.getElementById("btnLoadApps").addEventListener("click", renderApps);
  document.getElementById("appSearch").addEventListener("input", renderApps);

  // ---- file manager ----
  function currentDir() {
    var p = document.getElementById("fpath").value.trim();
    return p || rootPath;
  }

  function renderList(dir) {
    var list = document.getElementById("flist");
    list.innerHTML = "";
    var raw = call("listFiles", dir);
    if (!raw) return;
    if (raw.indexOf("ERR:") === 0) { say(raw.slice(4)); return; }
    var arr = []; try { arr = JSON.parse(raw); } catch (e) { say("তালিকা পড়া যায়নি।"); return; }
    if (!arr.length) { list.textContent = "এই ফোল্ডার খালি।"; return; }
    arr.forEach(function (f) {
      var row = document.createElement("div");
      row.className = "file";
      var info = document.createElement("div");
      info.style.minWidth = "0";
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = (f.dir ? "📁 " : "📄 ") + f.name;
      var sub = document.createElement("small");
      sub.textContent = f.dir ? "ফোল্ডার" : (f.size + " বাইট");
      info.appendChild(name); info.appendChild(sub);
      var del = document.createElement("button");
      del.className = "del";
      del.textContent = "মোছো";
      del.addEventListener("click", function () {
        if (!window.confirm('"' + f.name + '" মুছে ফেলবেন?')) return;
        var r = call("deleteFile", f.path);
        if (r === "OK") { say("মুছে ফেলা হয়েছে: " + f.name); renderList(dir); }
        else say(r.replace("ERR:", ""));
      });
      row.appendChild(info); row.appendChild(del);
      list.appendChild(row);
    });
    say("");
  }

  document.getElementById("btnList").addEventListener("click", function () {
    renderList(currentDir());
  });

  document.getElementById("btnNew").addEventListener("click", function () {
    var name = document.getElementById("fname").value.trim();
    if (!name) { say("ফাইলের নাম লিখুন।"); return; }
    var dir = currentDir();
    var path = dir.replace(/\/+$/, "") + "/" + name;
    var content = document.getElementById("fcontent").value;
    var r = call("createFile", path, content);
    if (r.indexOf("OK:") === 0) { say("ফাইল তৈরি হয়েছে: " + name); renderList(dir); }
    else if (r) say(r.replace("ERR:", ""));
  });

  // ---- mic (Gemini Live) ----
  var KEY_NAME = "saara_gemini_key";
  var micOn = false;
  function setMicUi(on) {
    micOn = on;
    document.querySelectorAll(".mic-live").forEach(function (el) { el.classList.toggle("on", on); });
  }
  function getKey() {
    var k = localStorage.getItem(KEY_NAME);
    if (!k) {
      k = (window.prompt("Gemini API key দাও (AIza...)") || "").trim();
      if (k) localStorage.setItem(KEY_NAME, k);
    }
    return k;
  }
  function toggleMic() {
    if (typeof SaaraMic === "undefined") { say("মাইক মডিউল পাওয়া যায়নি।"); return; }
    if (micOn) { SaaraMic.stop(); setMicUi(false); return; }
    var key = getKey();
    if (!key) return;
    SaaraMic.start({
      apiKey: key,
      voice: "Kore",
      systemPrompt: "Tum Saara ho, ek pyaari female voice assistant. Jawab chhote aur friendly rakho.",
      onConnected: function () { setMicUi(true); },
      onClosed: function () { setMicUi(false); },
      onError: function (e) { setMicUi(false); say(String(e)); }
    });
  }
  document.getElementById("btnMic").addEventListener("click", toggleMic);
  document.getElementById("orbMic").addEventListener("click", toggleMic);
})();
</script>
</body>
</html>
